<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="台股漲停後候選股的盤後準備、隔日 09:15 判斷與 D2+ 後續觀察。" />
    <title>每日決策中心｜漲停後交易作戰手冊</title>
    <link rel="stylesheet" href="ux.css?v=20260811" />
    <script type="module" src="market-page.js?v=20260811"></script>
  </head>
  <body data-page="market">
    <a class="skip-link" href="#main">跳到主要內容</a>
    <header class="topbar">
      <a class="brand" href="market.html" aria-label="每日決策中心首頁"><span class="brand-mark">LT</span><span>漲停後作戰手冊</span></a>
      <nav class="desktop-nav" aria-label="主要導覽">
        <a href="market.html" data-nav="market">每日看盤</a>
        <a href="rules.html" data-nav="rules">策略規則</a>
        <a href="validation.html" data-nav="validation">策略驗證</a>
        <a href="status.html" data-nav="status">系統狀態</a>
      </nav>
    </header>

    <main id="main" class="page-shell">
      <section class="hero compact-hero">
        <div>
          <p class="eyebrow">每日決策中心</p>
          <h1 id="page-title">今天該做什麼？</h1>
          <p id="page-intro">先確認日期與階段，再閱讀個股條件。本頁只提供研究與紙上觀察，不會自動下單。</p>
        </div>
        <label class="date-control" for="decision-date"><span>看盤交易日</span><select id="decision-date" disabled><option>載入中…</option></select></label>
      </section>

      <div id="historical-banner" class="notice notice-history" hidden></div>
      <div id="load-error" class="notice notice-danger" role="alert" hidden></div>

      <section id="decision-overview" class="decision-overview" aria-live="polite" aria-busy="true">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-line"></div>
      </section>

      <section class="stage-section" aria-labelledby="stage-heading">
        <div class="section-heading">
          <div><p class="eyebrow">分開看每一個交易階段</p><h2 id="stage-heading">不要把今天與明天的名單混在一起</h2></div>
          <button id="clear-filters" class="text-button" type="button" hidden>清除篩選</button>
        </div>

        <div id="stage-tabs" class="stage-tabs" role="tablist" aria-label="選擇交易階段">
          <button id="tab-d1" role="tab" type="button" data-stage="d1" aria-controls="candidate-list" aria-selected="true" disabled>今日 09:15 判斷 <span>—</span></button>
          <button id="tab-d0" role="tab" type="button" data-stage="d0" aria-controls="candidate-list" aria-selected="false" disabled>明日準備名單 <span>—</span></button>
          <button id="tab-d2" role="tab" type="button" data-stage="d2" aria-controls="candidate-list" aria-selected="false" disabled>D2+ 後續觀察 <span>—</span></button>
        </div>

        <div class="stage-toolbar">
          <div>
            <h3 id="stage-title">正在載入階段資料</h3>
            <p id="stage-subtitle">請稍候。</p>
          </div>
          <button id="toggle-filters" class="secondary-button" type="button" aria-expanded="false" aria-controls="filters" disabled>篩選與匯出</button>
        </div>

        <div id="filters" class="filters" hidden>
          <label>型態<select id="filter-setup"><option value="all">全部型態</option><option value="A">A 型</option><option value="B">B 型</option></select></label>
          <label>流動性<select id="filter-liquidity"><option value="all">全部流動性</option><option value="PRIMARY_5000_PLUS">主池 5,000 張以上</option><option value="FALLBACK_2000_4999">備選 2,000–4,999 張</option></select></label>
          <label>資料風險<select id="filter-risk"><option value="all">全部</option><option value="clear">風險資料可用</option><option value="flagged">有警示或資料不足</option></select></label>
          <label>排序<select id="sort-by"><option value="priority">優先閱讀</option><option value="volume">成交量高到低</option><option value="stock">股票代號</option></select></label>
          <div class="filter-actions"><button type="button" id="export-csv">匯出目前名單</button><button type="button" id="copy-view-link">複製此畫面連結</button></div>
        </div>

        <div id="candidate-list" class="candidate-list" role="tabpanel" aria-labelledby="tab-d1" aria-live="polite" aria-busy="true">
          <article class="candidate-card skeleton-card"><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></article>
          <article class="candidate-card skeleton-card"><div class="skeleton skeleton-heading"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></article>
        </div>
      </section>

      <details class="support-panel" id="industry-panel">
        <summary>板塊共識與資料說明</summary>
        <div id="industry-content"><p>等待載入。</p></div>
      </details>

      <details class="support-panel" id="history-panel">
        <summary>查看個股 D0 → D1 → D2+ 歷程（需要時才載入）</summary>
        <div id="history-content"><button id="load-history" class="secondary-button" type="button">載入歷程</button></div>
      </details>

      <aside class="plain-warning"><strong>使用原則：</strong>「保留監看」不等於買進。未到指定日期、資料不完整、處置／公司行動風險、停損價不合理或風險超過 5%，一律不介入。</aside>
    </main>

    <nav class="mobile-nav" aria-label="手機主要導覽">
      <a href="market.html" data-nav="market"><span aria-hidden="true">盤</span>每日看盤</a>
      <a href="rules.html" data-nav="rules"><span aria-hidden="true">則</span>策略規則</a>
      <a href="validation.html" data-nav="validation"><span aria-hidden="true">驗</span>策略驗證</a>
      <a href="status.html" data-nav="status"><span aria-hidden="true">況</span>系統狀態</a>
    </nav>
  </body>
</html>
